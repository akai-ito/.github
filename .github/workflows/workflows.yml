name: Workflows and scripts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: Workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint .github/workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # shellcheck disable=SC2016
          ./actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck on the hooks and scripts
        run: |
          scripts=$(find .githooks .github/scripts -type f 2>/dev/null || true)
          if [ -z "$scripts" ]; then echo "No shell scripts to check."; exit 0; fi
          # shellcheck disable=SC2086
          shellcheck $scripts
